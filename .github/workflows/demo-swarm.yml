# demo-swarm -- a real swarm that a web page can watch happen.
#
# The page at https://aitherium.github.io/awnix/demo/ polls the public Actions API
# for the newest run of THIS file and renders every job and step as it moves. That
# is why the work is cut into many small steps instead of one long one: the API
# only advances a step when it closes, so step granularity IS the live feed.
#
# No `uses:` anywhere. The awnix repo runs under an org action allowlist, and a
# demo that cannot start is worse than no demo. Everything below is runner-provided
# python3 and sh.
#
# Dispatch-only, read-only, no secrets, no network calls beyond pip (which is not
# used). The work is deterministic arithmetic so a red run means the runner failed,
# never that the demo drifted.
name: demo swarm

on:
  workflow_dispatch:
    inputs:
      legs:
        description: 'How many swarm legs (runner jobs) to fan out'
        type: choice
        options: ['3', '6', '9']
        default: '6'
      work:
        description: 'Iterations per leg'
        type: choice
        options: ['20000', '60000', '120000']
        default: '60000'

permissions:
  contents: read

concurrency:
  group: demo-swarm
  cancel-in-progress: true

jobs:
  plan:
    name: plan the expedition
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - name: read the fan-out
        id: m
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          n = int(os.environ.get("LEGS", "6"))
          print("matrix=" + json.dumps({"leg": list(range(1, n + 1))}))
          PY
        env:
          LEGS: ${{ inputs.legs }}
      - name: expedition planned
        run: echo "fan-out is ${{ inputs.legs }} legs x ${{ inputs.work }} iterations"

  swarm:
    name: leg ${{ matrix.leg }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: claim leg ${{ matrix.leg }}
        run: |
          echo "leg ${{ matrix.leg }} claimed on $(hostname)"
          echo "runner: ${RUNNER_NAME:-unknown} os: $(uname -sm)"
          nproc
      - name: phase 1 - hash the seed
        run: |
          python3 -c "import hashlib,sys; h=hashlib.sha256(b'leg${{ matrix.leg }}').hexdigest(); print('seed', h[:32])"
      - name: phase 2 - iterate
        run: |
          python3 - <<'PY'
          import os, time
          n = int(os.environ.get("WORK", "60000"))
          t = time.time(); s = 0
          for i in range(n):
              s = (s * 1103515245 + 12345) & 0x7FFFFFFF
          print("iterations", n, "checksum", s, "in", round(time.time() - t, 2), "s")
          PY
        env:
          WORK: ${{ inputs.work }}
      - name: phase 3 - verify determinism
        run: |
          python3 - <<'PY'
          a = [1, 1]
          for _ in range(30):
              a.append(a[-1] + a[-2])
          print("fib30", a[-1], "stable", a[-1] == 1346269)
          PY
      - name: leg ${{ matrix.leg }} result
        run: |
          echo "{\"leg\": ${{ matrix.leg }}, \"status\": \"ok\", \"runner\": \"$RUNNER_NAME\"}" | tee leg-${{ matrix.leg }}.json
          echo "leg ${{ matrix.leg }} closed"

  expedition:
    name: expedition result
    needs: swarm
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: collate
        run: |
          echo "all ${{ inputs.legs }} legs returned"
          echo "expedition complete at $(date -u +%H:%M:%SZ)"
      - name: verdict
        run: echo "swarm finished - every leg reported ok"
