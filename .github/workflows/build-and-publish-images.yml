name: build-and-publish-images

# Builds the three PUBLIC awnix variants and pushes them to GHCR.
#
# This workflow is what makes the packages public, and that is not incidental. A GHCR
# package takes its visibility from where it was CREATED and can never be changed
# afterwards through any API (PATCH on the package endpoint 404s). A package pushed by
# hand from a build host is created `internal` and unlinked -- even when the image
# carries org.opencontainers.image.source. A package pushed by a workflow in a public
# repo is created public and linked. Measured both ways on 2026-08-21.
#
# So: if these images ever go back to being built by hand, they go back to being
# unreachable, and the only fix is to delete and rebuild them from here.
#
# ubuntu-latest is deliberate -- see the note in the sync script. The org's self-hosted
# runner groups refuse public repositories, and a self-hosted job from here queues
# forever with no error rather than failing.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "which to build (all | awnix | awnix-ai |
          awnix-full | awnix-ai-full | gobbonet-appliance)"
        required: false
        default: "all"
  push:
    branches: [main]
    paths:
      - ".DEPLOYMENT/standalone/bootc/**"
      - ".github/workflows/build-and-publish-images.yml"

concurrency:
  group: awnix-images
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # keyless cosign: every pushed digest is signed by THIS workflow
    steps:
      - uses: actions/checkout@v4

      # cosign, pinned and sha256-checked by the same script the image uses to verify.
      - name: install cosign
        run: |
          set -euo pipefail
          bash .DEPLOYMENT/standalone/bootc/sign-awnix-image.sh install "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # A bootc base plus 26 packages does not fit beside the hosted image's preinstalled
      # toolchains. Reclaiming this is the difference between a build and a disk error
      # twenty minutes in.
      - name: reclaim disk
        run: |
          set -euo pipefail
          echo "before: $(df -BG --output=avail / | tail -1)"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean || true
          echo "after:  $(df -BG --output=avail / | tail -1)"

      - name: login to ghcr
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | sudo podman login ghcr.io -u '${{ github.actor }}' --password-stdin
          # docker stays logged in too: the sign step reads digests with buildx.
          echo "${{ secrets.GITHUB_TOKEN }}"             | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: build the chain and push the three public variants
        env:
          WANT: ${{ github.event.inputs.variant || 'all' }}
        run: |
          set -euo pipefail
          # The tree sync-awnix.yml mirrors on every develop push. The older bootc/
          # copy at the repo root was written only by a manual --push and went stale
          # (2026-09-10 to 2026-10-03: 14 files where the base COPYs ~100).
          cd .DEPLOYMENT/standalone/bootc
          # PODMAN, not docker: centos-bootc already carries ~65 chunked layers and
          # Containerfile.awnix adds ~110 more; docker's overlay snapshotter stops at
          # "max depth exceeded" (run 37144050937, step 65/113). The private lane
          # builds the same files with podman (build_awnix_images.py) and never hit it.
          REG=ghcr.io/aitherium
          DATE_TAG="$(date +%Y.%m.%d)"

          want() { [ "$WANT" = "all" ] || [ "$WANT" = "$1" ]; }

          # `localhost/...` is how the Containerfiles refer to each other, so the local
          # tags have to match those names exactly or the FROM lines miss.
          echo "::group::awnix-base"
          sudo podman build -f Containerfile.awnix -t localhost/awnix-base:latest .
          echo "::endgroup::"

          # A denied push RECORDS the failure and lets the other variants continue.
          #
          # Measured 2026-09-10: gobbonet-appliance was refused with
          # `denied: permission_denied: write_package` -- the package already exists
          # from outside this repo, so this repo's GITHUB_TOKEN has no write access to
          # it however the workflow declares `packages: write`. Under set -e that one
          # ACL problem aborted the step, and awnix-desktop -- which had nothing wrong
          # with it -- was never built at all. One package's permissions must not
          # decide whether five others get published.
          #
          # The job still FAILS at the end, with every failure named. Failing fast
          # here hides results; failing late hides nothing.
          PUSH_FAILURES=""
          PUSHED=""
          # beta + date + sha, NEVER latest/stable: those move only through promote.yml,
          # by digest, after the update proof passed (AUC008). An installed box on the
          # stable channel therefore never sees an unproven push.
          push() {
            local img="$1" repo="$2" t
            for t in beta "$DATE_TAG" "sha-${GITHUB_SHA:0:12}"; do
              sudo podman tag "$img" "$REG/$repo:$t"
              if ! sudo podman push "$REG/$repo:$t"; then
                echo "::error::push denied for $REG/$repo:$t -- if this is"
                echo "::error::permission_denied:write_package the package already"
                echo "::error::exists and this repository is not granted write access"
                echo "::error::to it. Fix it in the package's settings (Manage Actions"
                echo "::error::access -> add Aitherium/awnix with write), not here."
                PUSH_FAILURES="$PUSH_FAILURES $repo"
                return 0
              fi
            done
            PUSHED="$PUSHED $repo"
            echo "pushed $REG/$repo (beta, $DATE_TAG, sha-${GITHUB_SHA:0:12})"
          }

          if want awnix; then push localhost/awnix-base:latest awnix; fi


          if want awnix-full; then
            echo "::group::awnix-full"
            sudo podman build -f Containerfile.awnix-full -t localhost/awnix-full:latest .
            echo "::endgroup::"
            push localhost/awnix-full:latest awnix-full
          fi

          # The third public rung: the aw* stack WITH inference. Builds on
          # awnix-full, so that image must exist first -- built here rather than
          # assumed, because `want awnix-ai-full` alone must be a complete lane.
          if want awnix-ai-full; then
            echo "::group::awnix-full (parent)"
            sudo podman build -f Containerfile.awnix-full -t localhost/awnix-full:latest .
            echo "::endgroup::"
            echo "::group::awnix-ai-full"
            sudo podman build -f Containerfile.awnix-ai-full -t localhost/awnix-ai-full:latest .
            echo "::endgroup::"
            push localhost/awnix-ai-full:latest awnix-ai-full
          fi

          # The appliance: awnix with GobboNet as the front end. No local COPY --
          # it fetches Bonsai weights from huggingface.co/prism-ml (our own model)
          # and GobboNet from its public repo, so the only build-context dependency
          # is the runner chain below.
          if want gobbonet-appliance; then
            echo "::group::awnix-runner (parent)"
            sudo podman build -f Containerfile.awnix-runner -t localhost/awnix-runner:latest .
            echo "::endgroup::"
            echo "::group::awnix-runner-ai (parent)"
            sudo podman build -f Containerfile.awnix-runner-ai -t localhost/awnix-runner-ai:latest .
            echo "::endgroup::"
            echo "::group::gobbonet-appliance"
            sudo podman build -f Containerfile.gobbonet-appliance \
              -t localhost/gobbonet-appliance:latest .
            echo "::endgroup::"
            push localhost/gobbonet-appliance:latest gobbonet-appliance
          fi

          # awnix-desktop is NOT built here, and that is a source question, not a
          # build question. Its build needs AitherOS/apps/AitherDesktop, which exists
          # only in the monorepo -- the public repo carries dev/ and the staged
          # .DEPLOYMENT tree, nothing under AitherOS/apps. A first version of
          # this step declared `--build-context deskapp=AitherOS/apps/AitherDesktop`
          # and died with `failed to get build context deskapp: stat ...: no such
          # file or directory` AFTER building three images, measured in run
          # 34423466324.
          #
          # Publishing the desktop IMAGE from here would mean staging the app's
          # SOURCE into the public repo -- a separate, one-way decision the owner has
          # not made. Until then it builds from the monorepo lane, where the source
          # is, and this lane does not pretend otherwise.

          if want awnix-ai; then
            echo "::group::awnix-runner (intermediate)"
            sudo podman build -f Containerfile.awnix-runner -t localhost/awnix-runner:latest .
            echo "::endgroup::"
            echo "::group::awnix-runner-ai"
            sudo podman build -f Containerfile.awnix-runner-ai -t localhost/awnix-runner-ai:latest .
            echo "::endgroup::"
            push localhost/awnix-runner-ai:latest awnix-ai
          fi

          # SIGN BY DIGEST (AUC001), after every push: resolve :beta to the digest just
          # pushed and sign THAT, keyless, as this workflow -- the identity
          # awnix-signers.conf requires, so `awnix update check` can verify it.
          for repo in $PUSHED; do
            dg=$(docker buildx imagetools inspect "$REG/$repo:beta" --format '{{json .Manifest}}' \
                 | python3 -c 'import json,sys;print(json.load(sys.stdin)["digest"])')
            bash sign-awnix-image.sh sign "$REG/$repo@$dg"
          done

          if [ -n "$PUSH_FAILURES" ]; then
            echo "::error::these variants could not be pushed:$PUSH_FAILURES"
            exit 1
          fi

      # A push that reports success and leaves the package unreachable is the exact
      # failure this lane exists to end, so assert the OUTCOME rather than the exit code:
      # ask GHCR for an anonymous pull token and fetch the manifest with no credentials.
      - name: verify each pushed image is anonymously pullable
        env:
          WANT: ${{ github.event.inputs.variant || 'all' }}
        run: |
          set -euo pipefail
          accept='application/vnd.oci.image.index.v1+json'
          accept="$accept,application/vnd.docker.distribution.manifest.v2+json"
          fail=0
          # awnix-desktop is absent on purpose -- this lane cannot
          # build it (see above), so it must not claim to verify it.
          REPOS='awnix awnix-ai awnix-full awnix-ai-full gobbonet-appliance'
          for repo in $REPOS; do
            if [ "$WANT" != "all" ] && [ "$WANT" != "$repo" ]; then continue; fi
            scope="repository:aitherium/$repo:pull"
            tok=$(curl -sf "https://ghcr.io/token?scope=$scope&service=ghcr.io" \
                  | python3 -c 'import sys,json;print(json.load(sys.stdin).get("token",""))')
            code=$(curl -s -o /dev/null -w '%{http_code}' \
                   -H "Authorization: Bearer $tok" \
                   -H "Accept: $accept" \
                   "https://ghcr.io/v2/aitherium/$repo/manifests/beta")
            if [ "$code" = "200" ]; then
              echo "  ok        $repo anonymously pullable"
            else
              echo "  BROKEN    $repo answered $code to an anonymous pull"
              fail=1
            fi
          done
          [ "$fail" = "0" ] || {
            echo
            echo "A package exists but strangers cannot pull it, so `bootc upgrade` fails"
            echo "for every installed machine. Visibility is fixed at CREATION and there is"
            echo "no API to change it: delete the package, then re-run this workflow."
            exit 1
          }
