# /etc/pip.conf for the appliance and air-gap images (garg, gobbonet, aitheros,
# the awnix-airgap profile). Shipped from .DEPLOYMENT/standalone/bootc/awnix-pip-airgap.conf.
#
# no-index: runtime pip can NEVER reach PyPI (AFRL seam: no runtime egress).
# Anything installable on this box is a wheel the image carries under
# /usr/share/awnix/wheelhouse/<layer>, hash-checked by `awnix wheelhouse verify`.
# A component whose wheels are not vendored reports state=unavailable,
# reason 'not vendored', instead of a network error.
#
# Every directory named here exists in the image (empty when the layer is not
# part of this variant), so pip never warns about a missing find-links path.
[global]
no-index = true
find-links =
    /usr/share/awnix/wheelhouse/base
    /usr/share/awnix/wheelhouse/garg
    /usr/share/awnix/wheelhouse/gobbonet
    /usr/share/awnix/wheelhouse/components
disable-pip-version-check = true
