# /etc/awnix/update.conf -- how this box takes updates. awnix-update.conf(5).
#
# KEY=VALUE only; it is read, never sourced. /etc is 3-way merged by bootc, so an edit
# here survives every upgrade. Change it with `awnix update channel <c>` and
# `awnix update auto-apply on|off`, or the console's Updates tab.
#
# CHANNEL     stable  moves only after the hosted upgrade/rollback proof passes (default)
#             beta    every CI build, before it is proven
# AUTO_APPLY  0       stage verified updates, reboot only when an admin says so (default)
#             1       reboot into a verified, staged update as soon as it is staged
#
# Until the first promotion to a channel, <repo>:<channel> does not exist. A check then
# records state channel-unpublished and exits 2 (could not judge): the box keeps what it
# runs and never falls back to an unproven :latest. Promotion is awnix-promote.yml.
#
# awnix-update.timer checks about every six hours (10 min after boot, then 6 h, with
# up to 30 min of random delay so a fleet of boxes does not ask the registry at once).
CHANNEL=stable
AUTO_APPLY=0
