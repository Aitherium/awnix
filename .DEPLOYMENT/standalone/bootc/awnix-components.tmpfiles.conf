# awnix components: state, packs, per-component env and the op log.
# Installed as /usr/lib/tmpfiles.d/awnix-components.conf. bootc does not populate
# /var from the image, so these must be created at boot on every variant.
d /var/lib/awnix 0755 root root -
d /var/lib/awnix/components 0755 root root -
d /var/lib/awnix/packs 0755 root root -
d /etc/awnix/components 0700 root root -
d /var/log/awnix 0750 root root -
