# awnix logrotate -- installed as /etc/logrotate.d/awnix
#
# copytruncate: the daemons keep their fd open and nothing signals them to reopen.
# That is only safe when the writer opened the file with O_APPEND ('>>'): a writer
# that opened it with '>' keeps writing at its old offset after the truncate, which
# leaves a sparse file that the next rotation copies back out as zeros.
# OPH005 checks the garg daemons for exactly that.
#
# maxsize + the hourly logrotate.timer drop-in (logrotate-hourly.conf) mean a runaway
# log is cut within an hour, not at the next daily run.
/var/log/aither/*.log /var/log/aitheros/*.log /var/log/awnix*/*.log {
    maxsize 20M
    rotate 5
    compress
    delaycompress
    copytruncate
    missingok
    notifempty
    su root root
}
