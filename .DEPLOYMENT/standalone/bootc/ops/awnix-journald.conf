# awnix journald caps -- installed as /usr/lib/systemd/journald.conf.d/50-awnix.conf
#
# An appliance runs unattended for weeks on a small disk. Without caps journald
# takes up to 10% of /var (4 GiB ceiling) and can starve qdrant and the model store.
# An admin override goes in /etc/systemd/journald.conf.d/, which sorts after this
# vendor file. awnix-ops-doctor LOG001/LOG002 read these values back from the
# running system; check_awnix_ops_hardening.py OPH003 pins them in the tree.
[Journal]
Storage=persistent
SystemMaxUse=256M
SystemKeepFree=1G
SystemMaxFileSize=32M
RuntimeMaxUse=64M
