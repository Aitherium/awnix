# awnix chrony drop-in -- installed as /etc/chrony.d/50-awnix.conf
#
# Why chrony matters on an appliance: offline license expiry (status.json `exp`)
# and every audit timestamp are only as good as the clock. A box that boots with a
# dead RTC battery and no NTP reads 1970 or a factory date; `awnix-ops-doctor`
# CLK003 compares the clock against the image build epoch
# (/usr/lib/awnix/build-epoch) and the license `iat` so that failure is loud.
#
# ZERO OPEN PORTS (air-gap proof Step 1): chrony is a CLIENT only.
#   cmdport 0   -- no UDP 323 command socket on any IP; `chronyc` still works as
#                  root through the unix socket /run/chrony/chronyd.sock.
#   port 0      -- chrony's default already serves no NTP; stated explicitly so a
#                  later `allow` line cannot silently open UDP 123.
# awnix-ops-doctor CLK006 fails if chronyd holds any IP listen socket, and
# check_awnix_ops_hardening.py OPH002 fails the tree if cmdport is not 0.
#
# ZERO EGRESS is a separate promise: not listening does not stop chrony SENDING.
# CentOS Stream's own /etc/chrony.conf carries `pool 2.centos.pool.ntp.org iburst`,
# and a drop-in cannot unset it. The image chain therefore comments it out:
#   RUN sed -ri 's/^(pool|server|peer)[[:space:]]/# awnix-airgap: &/' /etc/chrony.conf
# (OPH002 fails the tree without that RUN, and fails this file if it names any
# pool/server/peer). On the booted box CLK007 fails when a public host is configured;
# an operator who wants public NTP accepts the egress with
#   touch /etc/awnix/allow-public-ntp
# and CLK007 becomes a warning. `sourcedir /run/chrony-dhcp` stays: it only uses
# servers the LAN's own DHCP hands out.
cmdport 0
port 0

# Step the clock on the first three updates if it is off by more than one second
# (a cold boot with a drifted RTC), then slew only.
makestep 1.0 3

# Copy system time back to the RTC every 11 minutes (kernel sync mode), so the next
# cold boot in an air gap starts from the last good time instead of the factory date.
rtcsync

# Air-gap / LAN time source: do NOT edit this file. The image ships with NO time
# source; drop a second file
#   /etc/chrony.d/10-awnix-lan.conf
# containing one line per LAN server (it is the only source, not an addition), e.g.
#   server 10.0.0.1 iburst
# With no reachable server chrony simply stays unsynchronised; CLK002 reports it
# as a warning, never a failure, and greenboot never rolls back over it.
