# installed as /usr/lib/systemd/system/logrotate.timer.d/50-awnix-hourly.conf
#
# The stock logrotate.timer is daily, so a `maxsize` limit is only checked once
# a day and a runaway daemon can fill a small disk before then. Running it hourly
# makes maxsize an actual limit. The empty OnCalendar= clears the stock daily entry
# first; without it the timer would fire on both schedules.
[Timer]
OnCalendar=
OnCalendar=hourly
AccuracySec=5m
Persistent=true
