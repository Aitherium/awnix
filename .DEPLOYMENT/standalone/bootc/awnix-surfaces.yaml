# awnix-surfaces.yaml -- which user-facing surface ships in which image, and how.
#
# FORMAT: a JSON document with full-line '#' comments. That is valid YAML, and it is
# what the stdlib can read on the box: awnix-console serves the `surfaces` tab from the
# installed copy (/usr/share/awnix/surfaces.yaml) with no PyYAML. Keep it JSON.
#
# delivery, per variant and surface:
#   baked          in the image. check_awnix_surfaces AWS002 proves it through the
#                  Containerfile FROM chain (surface_catalog.<id>.baked_proof, all regexes).
#   image-private  pulled from a private ghcr package, ONLY with the registry credential
#                  `aitheros license refresh` mints from an activated license.
#   link           a hosted URL (host must be in public_hosts, AWS005) or a local
#                  http://<host>:<port> link; <host> is filled from the request.
#   absent         not offered.
#
# Rules the checker holds (AWS001-AWS007): rows == awnix-variants.yaml; no BUSL or
# commercial surface baked into a publish:true variant; Living Desktop, AOL and Veil
# are link-only on every public variant. awnix-desktop-open and awnix-dev carry no
# console in v1 (D-2662): desktop-open is FROM fedora-bootc and inherits none of
# Containerfile.awnix, and awnix-dev is the internal sandbox image.
#
# cli_contract: dispatcher verb -> the gap that owns /usr/libexec/awnix/awnix-<verb>.
# cli_sources:  binary name in awnix_console/actions.py -> its source in this directory;
#               AWS006 runs `<source> --list-verbs` to prove every allowlisted verb exists.
{
  "version": 1,
  "public_hosts": [
    "aitherium.com",
    "www.aitherium.com",
    "desktop.aitherium.com",
    "docs.aitherium.com",
    "api.aitherium.com"
  ],
  "surface_catalog": {
    "console": {
      "label": "Appliance console",
      "licence": "Apache-2.0",
      "description": "This page: setup, activation, updates, components.",
      "baked_proof": [
        "awnix-console",
        "systemctl enable[^\n]*awnix-console\\.service"
      ]
    },
    "awsh": {
      "label": "awsh",
      "licence": "Apache-2.0",
      "command": "awsh",
      "description": "The terminal agent. Run it from an SSH session.",
      "baked_proof": [
        "npm install -g[^\n]*@aitherium/awsh"
      ]
    },
    "awdesk": {
      "label": "AitherDesktop",
      "licence": "BUSL-1.1",
      "description": "The desktop overlay. Delivered by a license-gated private pull.",
      "baked_proof": [
        "COPY --from=deskapp"
      ]
    },
    "living_desktop": {
      "label": "Living Desktop",
      "licence": "BUSL-1.1",
      "url": "https://desktop.aitherium.com",
      "description": "The hosted Living Desktop.",
      "baked_proof": [
        "__never_baked_in_v1__"
      ]
    },
    "aol": {
      "label": "AOL",
      "licence": "BUSL-1.1",
      "url": "https://aitherium.com",
      "description": "The hosted AitherOS portal.",
      "baked_proof": [
        "__never_baked_in_v1__"
      ]
    },
    "veil": {
      "label": "Veil",
      "licence": "BUSL-1.1",
      "url": "https://aitherium.com",
      "description": "The hosted Veil dashboard.",
      "baked_proof": [
        "__never_baked_in_v1__"
      ]
    },
    "gargbot_ui": {
      "label": "GargBot",
      "licence": "commercial",
      "description": "The GargBot product on this box.",
      "baked_proof": [
        "COPY \\.gargbot-backend /opt/gargbot/backend"
      ]
    }
  },
  "cli_contract": {
    "update": "updates",
    "component": "components",
    "license": "activation",
    "setup": "installer-setup",
    "console": "console-surfaces",
    "endpoints": "portability",
    "doctor": "console-surfaces"
