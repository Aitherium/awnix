# awnix open desktop -- sway defaults. Read after /etc/sway/config, so every line
# here is an awnix default a user overrides in ~/.config/sway/config.

set $mod Mod4
set $term foot
set $menu wofi --show drun

# The agent key. Omarchy's opens a cloud CLI; this one opens awsh against the
# model this machine serves itself, so it answers with no network.
bindsym $mod+a exec $term --title awsh -e awsh
bindsym $mod+Return exec $term
bindsym $mod+space exec $menu
bindsym $mod+q kill
bindsym $mod+Shift+e exec swaynag -t warning -m 'Log out?' -B 'Yes' 'swaymsg exit'
bindsym $mod+l exec swaylock -f -c 0b1020

# Text from anywhere on screen to the clipboard (local OCR).
bindsym $mod+Ctrl+Print exec sh -c 'grim -g "$(slurp)" - | tesseract - - 2>/dev/null | wl-copy'
bindsym Print exec sh -c 'grim -g "$(slurp)" - | wl-copy -t image/png'

# One palette for the whole desktop (the Aitherium dark-glass tokens).
client.focused          #00c8d7 #0b1020 #e6f0ff #00c8d7 #00c8d7
client.unfocused        #1c2540 #0b1020 #8a94b0 #1c2540 #1c2540
output * bg #0b1020 solid_color
default_border pixel 2
gaps inner 6

bar {
    swaybar_command waybar
}

exec mako
exec swayidle -w timeout 600 'swaylock -f -c 0b1020' before-sleep 'swaylock -f -c 0b1020'
