# /usr/lib/tmpfiles.d/aither-license.conf -- the activation plane's directories.
# Spool + status live in a root-only directory; the license itself is /etc/aither/appliance.lic (0600).
d /var/lib/aither 0755 root root -
d /var/lib/aither/license 0700 root root -
d /etc/aither 0755 root root -
d /etc/ostree 0755 root root -
d /etc/containers 0755 root root -
# Rootful podman (and quadlet pulls) read /run/containers/0/auth.json first. Point it at the
# file `aitheros license refresh` writes, so no DefaultEnvironment=REGISTRY_AUTH_FILE hack is needed.
d /run/containers/0 0700 root root -
L /run/containers/0/auth.json - - - - /etc/containers/auth.json
