# /etc/pip.conf for the awnix base images (awnix, awnix-full, runner, runner-ai).
# Shipped from .DEPLOYMENT/standalone/bootc/awnix-pip.conf.
#
# The image's own vendored wheels (/usr/share/awnix/wheelhouse/<layer>, checked
# by `awnix wheelhouse verify`) are offered to every pip call first, so a
# reinstall of anything the image shipped resolves locally. The index stays
# reachable on these general-purpose images; the appliance and air-gap images
# ship awnix-pip-airgap.conf instead, which removes it.
#
# Every directory named here exists in the image (empty when the layer is not
# part of this variant), so pip never warns about a missing find-links path.
[global]
find-links =
    /usr/share/awnix/wheelhouse/base
    /usr/share/awnix/wheelhouse/full
    /usr/share/awnix/wheelhouse/components
disable-pip-version-check = true
