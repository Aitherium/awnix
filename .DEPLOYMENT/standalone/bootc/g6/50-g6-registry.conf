# G6 proof: the local registry the host serves on 127.0.0.1:5000, which qemu user-mode
# networking presents to the guest as 10.0.2.2:5000. Plain HTTP, no credential: the
# point of G6 is an upgrade that needs NO auth.json (the 2026-09-13 proof ended
# AUTH-WALL). Baked only into the G6 proof images, never into a shipped awnix image.
[[registry]]
location = "10.0.2.2:5000"
insecure = true
