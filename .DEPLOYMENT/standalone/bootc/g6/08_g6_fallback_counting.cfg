# G6: greenboot boot counting for a bootupd static GRUB config.
# grub2's /etc/grub.d/08_fallback_counting is what makes greenboot's rollback automatic
# on a grub2-mkconfig system: while boot_counter is set and boot_success=0, every boot
# decrements it, and at 0 the rollback deployment (menu entry 1) boots instead. A system
# installed by `bootc install` uses bootupd's STATIC grub.cfg, which may not carry that
# hunk. Containerfile.g6 adds this file only when the image has no boot_counter logic of
# its own, and records which case it was in /usr/lib/g6/grub_counting, so the verdict says
# whether the fallback came from the image as shipped or from this shim.
insmod increment
if [ -n "${boot_counter}" -a "${boot_success}" = "0" ]; then
  if [ "${boot_counter}" = "0" -o "${boot_counter}" = "-1" ]; then
    set default=1
    set boot_counter=-1
  else
    decrement boot_counter
  fi
  save_env boot_counter
fi
