# awnix offline-update (G5): root-only staging for bundles copied off removable media,
# the admin trust store, and the audit log directory. Installed to /usr/lib/tmpfiles.d/.
d /var/lib/awnix 0755 root root -
d /var/lib/awnix/offline 0700 root root -
d /etc/awnix/offline-trust.d 0755 root root -
d /var/log/awnix 0750 root root -
