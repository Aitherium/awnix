# awnix-mesh state. /etc/awnix/mesh holds the capability credential and the WireGuard
# private key (both 0600); /etc persists across bootc upgrades and rolls with the admin's
# config, never with the image. /var/lib/awnix/mesh holds status.json (no secrets) and a
# pending.json (0600) while a join waits for the network.
d /var/lib/awnix/mesh 0700 root root -
d /etc/awnix/mesh 0700 root root -
