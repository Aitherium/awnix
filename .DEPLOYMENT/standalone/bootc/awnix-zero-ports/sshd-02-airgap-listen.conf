# /etc/ssh/sshd_config.d/02-airgap-listen.conf -- airgap profile only.
#
# sshd stays installed so `sshd -T` still answers the Step-1 question
# (passwordauthentication no), but it listens on loopback only: nothing
# is reachable from off the box. ListenAddress is CUMULATIVE across files,
# so `awnix-zero-ports verify-static` checks that every listenaddress in
# `sshd -T` is loopback, not just that this file exists.
ListenAddress 127.0.0.1
ListenAddress ::1
