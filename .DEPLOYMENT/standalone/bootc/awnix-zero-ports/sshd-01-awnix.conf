# /etc/ssh/sshd_config.d/01-awnix.conf -- installed by awnix-zero-ports.
#
# Named 01- on purpose. sshd keeps the FIRST value it reads for most keywords,
# and the Include of sshd_config.d/*.conf sits at the top of the stock
# sshd_config, so this file beats 50-redhat.conf and a cloud-init
# 50-cloud-init.conf that sets "PasswordAuthentication yes" (ssh_pwauth).
#
# awnix ships no password for any account. Key-only is the one way in.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PermitRootLogin no
