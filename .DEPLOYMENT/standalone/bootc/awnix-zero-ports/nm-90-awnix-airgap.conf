# awnix airgap profile (awnix-zero-ports apply --profile airgap), installed as
# /usr/lib/NetworkManager/conf.d/90-awnix-airgap.conf.
#
# Demo Step 2 counts every frame on the isolated segment except ARP, IPv6 ND and
# MLD. A DHCPDISCOVER, an mDNS/LLMNR query or a connectivity probe is a failure.

[main]
# No automatic "Wired connection 1" (DHCP) for a NIC without a profile.
# awnix-airgap-wired.nmconnection (link-local only) covers every wired NIC.
no-auto-default=*

[connectivity]
enabled=false

[connection]
connection.mdns=0
connection.llmnr=0
