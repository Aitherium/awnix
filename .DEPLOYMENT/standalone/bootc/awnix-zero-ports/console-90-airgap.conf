# /usr/lib/awnix/console.d/zz-90-airgap.conf -- airgap profile only.
#
# awnix-console reads console.conf < console.d/*.conf (sorted, last wins)
# < /etc/awnix/console.conf < env. Installed as zz-90-airgap.conf so it sorts
# after every variant drop-in (garg.conf sorts after 90-*). The console then
# serves 127.0.0.1 only: reach it with a local browser or an ssh -L tunnel.
AWNIX_CONSOLE_BIND=127.0.0.1
AWNIX_CONSOLE_PROFILE=airgap
