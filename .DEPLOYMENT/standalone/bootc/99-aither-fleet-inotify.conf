# /etc/sysctl.d/99-aither-fleet-inotify.conf -- inotify headroom for the fleet host.
#
# The kernel default max_user_instances=128 is per-UID, and on a rootful podman host
# every root process that watches anything (systemd path units, conmon, dnsmasq's
# hostsdir watch, prometheus, cadvisor, udisks, polkit, ~100 containers' own
# watchers) draws from ONE budget. Measured on awnix 2026-09-27: three systemd .path
# units (nvidia-cdi-refresh, systemd-ask-password-console/-wall) sat FAILED with
# "Failed to enter waiting state: Too many open files" -- inotify exhaustion, not fds
# (DefaultLimitNOFILE is 1048576). 8192 is the common container-host value.
fs.inotify.max_user_instances = 8192
fs.inotify.max_user_watches = 1048576
