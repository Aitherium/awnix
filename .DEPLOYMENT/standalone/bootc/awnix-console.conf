# /usr/lib/awnix/console.conf -- awnix-console vendor defaults (KEY=VALUE, no expansion).
#
# Precedence, lowest first: this file < /usr/lib/awnix/console.d/*.conf (a variant's
# drop-in, e.g. garg.conf) < /etc/awnix/console.conf (the admin) < process environment.
#
# AWNIX_CONSOLE_BIND  auto = 0.0.0.0 on installed media (cloud-init NoCloud/None or no
#                     cloud-init), 127.0.0.1 on any other cloud datasource so a cloud
#                     VM never exposes the console on its public interface by default.
#                     Or an address. The console is https only on a non-loopback bind.
AWNIX_CONSOLE_BIND=auto
AWNIX_CONSOLE_PORT=9443
AWNIX_CONSOLE_PROFILE=awnix
AWNIX_CONSOLE_BRAND=awnix
