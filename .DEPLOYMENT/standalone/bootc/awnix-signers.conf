# /usr/share/awnix/signers.conf -- who may sign each image this box can update to.
#
#   <image repo> <cosign certificate-identity regexp | key:/path/to/cosign.pub>
#
# `awnix update check` refuses (state unsigned-refused) any digest whose keyless
# signature does not come from the matching identity, with issuer
# https://token.actions.githubusercontent.com. A repo with NO line here is refused.
#
# Two lanes publish the public images: the public repo's own image lane
# (Aitherium/awnix build-and-publish-images.yml on main) and the monorepo ISO lane
# (Aitherium/AitherOS build-awnix-iso.yml on develop, via publish-awnix-images.sh).
# Either may have produced the digest a channel points at, so both are accepted.
# Private images are only ever pushed by the monorepo lane.
#
# Kept in step with awnix-variants.yaml by check_awnix_update_chain.py (AUC004).
ghcr.io/aitherium/awnix ^https://github\.com/Aitherium/(awnix/\.github/workflows/build-and-publish-images\.yml@refs/heads/main|AitherOS/\.github/workflows/build-awnix-iso\.yml@refs/heads/develop)$
ghcr.io/aitherium/awnix-ai ^https://github\.com/Aitherium/(awnix/\.github/workflows/build-and-publish-images\.yml@refs/heads/main|AitherOS/\.github/workflows/build-awnix-iso\.yml@refs/heads/develop)$
ghcr.io/aitherium/awnix-full ^https://github\.com/Aitherium/(awnix/\.github/workflows/build-and-publish-images\.yml@refs/heads/main|AitherOS/\.github/workflows/build-awnix-iso\.yml@refs/heads/develop)$
ghcr.io/aitherium/awnix-ai-full ^https://github\.com/Aitherium/(awnix/\.github/workflows/build-and-publish-images\.yml@refs/heads/main|AitherOS/\.github/workflows/build-awnix-iso\.yml@refs/heads/develop)$
ghcr.io/aitherium/awnix-ai-offline ^https://github\.com/Aitherium/(awnix/\.github/workflows/build-and-publish-images\.yml@refs/heads/main|AitherOS/\.github/workflows/build-awnix-iso\.yml@refs/heads/develop)$
ghcr.io/aitherium/awnix-desktop-open ^https://github\.com/Aitherium/(awnix/\.github/workflows/build-and-publish-images\.yml@refs/heads/main|AitherOS/\.github/workflows/build-awnix-iso\.yml@refs/heads/develop)$
ghcr.io/aitherium/gobbonet-appliance ^https://github\.com/Aitherium/(awnix/\.github/workflows/build-and-publish-images\.yml@refs/heads/main|AitherOS/\.github/workflows/build-awnix-iso\.yml@refs/heads/develop)$
ghcr.io/aitherium/garg-appliance ^https://github\.com/Aitherium/AitherOS/\.github/workflows/build-awnix-iso\.yml@refs/heads/develop$
ghcr.io/aitherium/awnix-dev ^https://github\.com/Aitherium/AitherOS/\.github/workflows/build-awnix-iso\.yml@refs/heads/develop$
ghcr.io/aitherium/aitheros-bootc ^https://github\.com/Aitherium/AitherOS/\.github/workflows/(build-awnix-iso|publish-aitheros-appliance)\.yml@refs/heads/develop$
ghcr.io/aitherium/aitheros-bootc-cloud ^https://github\.com/Aitherium/AitherOS/\.github/workflows/(build-awnix-iso|publish-aitheros-appliance)\.yml@refs/heads/develop$
