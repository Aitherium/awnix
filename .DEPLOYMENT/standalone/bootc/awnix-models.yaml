# awnix model catalogue — what a booted box may fetch, and from where.
#
# Config, not code. Adding a model is an entry here; nothing in the serve script or the
# image changes. That is the AitherZero shape and it is the point: the previous version
# hardcoded ONE model (Bonsai-27B, 6833 MB) directly in a shell script, so "run something
# smaller" or "run one of our own models" meant editing the launcher.
#
# THE DEFAULT IS BONSAI AND ONLY BONSAI. The fleet models below are real and reachable,
# and they are opt-in: they are ours, several are 5-20 GB, and a first boot should not
# pull one because it happened to be listed. Choose with `--model <id>` or BONSAI_SIZE /
# AWNIX_MODEL.
#
# SIZES ARE MEASURED, NOT ESTIMATED. Every size_mb below was read from the actual artifact
# on 2026-08-21 (HTTP 200 + content-length, or the release asset list). A catalogue that
# guesses is worse than none: the selector sizes a model against real memory, so a wrong
# number is a wrong OOM.
#
# SHA256 IS MEASURED THE SAME WAY, AND ONLY WHERE IT WAS MEASURED. bonsai-1.7b and
# bonsai-4b were downloaded 2026-09-03 and hashed from the bytes on disk; their
# size_bytes is the file's real length and their size_mb was confirmed against it. The
# remaining entries carry NO sha256 on purpose -- a hash copied from a doc, a mirror
# listing or a sibling tier fails OPEN in the worst direction, because it makes the word
# "verified" a lie on every future run. An absent digest is an honest "not verified yet";
# a wrong one is not.

version: 1

sources:
  huggingface:
    kind: direct
    base: "https://huggingface.co/prism-ml/"
    # Public, no credential. The proven lane -- AitherVeil's own install-bonsai.sh has
    # fetched from here live.
  aitherkvcache:
    kind: github-release
    repo: "Aitherium/aitherkvcache"
    base: "https://github.com/Aitherium/aitherkvcache/releases/download/"
    # OUR mirror. Assets are split into ~1811 MB `.partN` slices because a GitHub release
    # asset is capped at 2 GiB -- the same wall the awnix ISO hit. Anything with
    # `parts:` is concatenated back in order before use, and the join is verified
    # against sha256 when one is recorded.

# BONSAI 1 FILES ARE THE PQ2_0 GGUFS (2026-09-27). The PrismML build every awnix
# image pins (prism-b10685) reads `Q2_0` as the upstream group-64 format and REFUSES the
# legacy group-128 Q2_0 files ("use the PQ2_0 version of this model (ggml type id
# 142)"). Same bytes per weight, same size, a different type id.

# ── the default ladder ──────────────────────────────────────────────────────────────
# Bonsai only. The selector takes the LARGEST whose weights fit HALF the detected
# budget -- half because llama.cpp needs room for the KV cache and context on top, and
# a model that loads then dies mid-generation is worse than one that never loaded.
defaults:
  # The top rung is Bonsai 2 27B (PTQ1_0): smaller than Bonsai 1 27B (5671 vs 6833 MB)
  # and it scored 0.9165 against Bonsai 1's 0.7821 on AitherBench. Every image that
  # reads this catalogue pins a PrismML llama.cpp build that serves it.
  ladder: [bonsai-1.7b, bonsai-4b, bonsai-8b, bonsai2-27b]
  # A deliberate floor: below this, refuse and say so rather than thrashing swap.
  min_budget_mb: 900
  # Weights must fit within budget/headroom_divisor. Lives HERE, not in a constant in
  # one consumer, because two consumers now read this catalogue (the appliance selector
  # and gen_aitheros_ladder.py) and a sizing rule that exists twice drifts while every
  # test on the other copy stays green.
  headroom_divisor: 2

models:
  bonsai-1.7b:
    source: huggingface
    path: "Ternary-Bonsai-1.7B-gguf/resolve/main/Ternary-Bonsai-1.7B-PQ2_0.gguf"
    file: "Ternary-Bonsai-1.7B-PQ2_0.gguf"
    size_mb: 441
    size_bytes: 463290464
    sha256: "de68ba48a8dacb21979915991e7741b917869d71410a370df951c0c3a237ae50"
    quant: PQ2_0
    note: "Runs on a phone-class GPU or plain CPU. The floor of the ladder."

  bonsai-4b:
    source: huggingface
    path: "Ternary-Bonsai-4B-gguf/resolve/main/Ternary-Bonsai-4B-PQ2_0.gguf"
    file: "Ternary-Bonsai-4B-PQ2_0.gguf"
    size_mb: 1025
    size_bytes: 1074969344
    sha256: "829abec7eb92f5bf464762be7c9e8a45d777c714543a1474fc90cee20e698beb"
    quant: PQ2_0
    note: "The 4 GB-card model — a GTX 1050 Ti lands here."

  bonsai-8b:
    source: huggingface
    path: "Ternary-Bonsai-8B-gguf/resolve/main/Ternary-Bonsai-8B-PQ2_0.gguf"
    file: "Ternary-Bonsai-8B-PQ2_0.gguf"
    sha256: "1376f942aa90e60f7b570c1d81b3916fea1315ff85aa1c4d19006af68fb4b922"
    size_mb: 2081
    quant: PQ2_0

  bonsai-27b:
    source: huggingface
    path: "Ternary-Bonsai-27B-gguf/resolve/main/Ternary-Bonsai-27B-PQ2_0.gguf"
    file: "Ternary-Bonsai-27B-PQ2_0.gguf"
    sha256: "e4781999f1997ef97ce0c58d05750835acc999d18d83ee6489ba7ac7b14cb5f6"
    size_mb: 6833
    quant: PQ2_0
    note: >-
      Bonsai 1. Off the default ladder since 2026-09-26 (bonsai2-27b replaces it);
      still fetchable with --model bonsai-27b.

  bonsai2-27b:
    source: huggingface
    path: "Ternary-Bonsai-2-27B-gguf/resolve/main/Ternary-Bonsai-2-27B-PTQ1_0.gguf"
    file: "Ternary-Bonsai-2-27B-PTQ1_0.gguf"
    size_mb: 5671
    size_bytes: 5946648928
    # The Hugging Face LFS object id (X-Linked-ETag), read 2026-09-26 from the live
    # resolve URL. That id IS the sha256 of the bytes -- LFS content-addresses by it --
    # so this is the upstream's own digest, not a figure copied from a doc.
    sha256: "53107f530aa52eb00912263ab1ee29bd199261c87cd7b4ad4ca1318c1fe33ee3"
    quant: PTQ1_0
    requires: prism-llama.cpp
    note: >-
      Bonsai 2, 1.75 bpw with a Walsh-Hadamard rotation. Needs the PrismML llama.cpp
      fork (stock llama.cpp loads it and emits gibberish); every awnix inference layer
      pins one. PQ2_0 (7206 MB) is the faster CUDA format; this is the Vulkan/CPU one.

  # ── the fleet models: OPT-IN, never reached by the default ladder ─────────────────
  # Real, measured, and ours. Listed so a booted box can run what the fleet runs without
  # anyone re-deriving a URL -- not so a first boot pulls 20 GB unasked.
  orchestrator:
    source: aitherkvcache
    release: "fleet-orchestrator-q4"
    file: "aither-orchestrator-Q4_K_M.gguf"
    parts: 3
    size_mb: 4792
    quant: Q4_K_M
    opt_in: true
    note: "The fleet's general executor."

  gemma4-12b:
    source: aitherkvcache
    release: "fleet-gemma4-12b-q4"
    file: "gemma4-12b-Q4_K_M.gguf"
    parts: 5
    size_mb: 7303
    quant: Q4_K_M
    opt_in: true
    note: "Dense 12B."

  qwen36-27b:
    source: aitherkvcache
    release: "fleet-qwen36-27b-q4"
    file: "qwen36-27b-Q4_K_M.gguf"
    parts: 5
    size_mb: 9055
    quant: Q4_K_M
    opt_in: true

  deepseek-v4-flash:
    source: aitherkvcache
    release: "fleet-deepseek-v4flash-iq2m"
    file: "DeepSeek-V4-Flash-0731-UD-IQ2_M-00002-of-00003.gguf"
    parts: 12
    size_mb: 21732
    quant: UD-IQ2_M
    opt_in: true
    note: >-
      Sharded 00001-of-00003 .. 00003-of-00003, and the middle shard is itself split
      into 12 parts. Large; measured 18.2 tok/s on the fleet and COMPUTE-bound rather
      than bandwidth-bound, so a small GPU does not rescue it.
