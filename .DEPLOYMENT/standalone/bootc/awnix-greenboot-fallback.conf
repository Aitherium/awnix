# Drop-in for greenboot-healthcheck.service:
#   /usr/lib/systemd/system/greenboot-healthcheck.service.d/50-awnix-greenboot-fallback.conf
# A failed health run starts awnix-greenboot-fallback.service, which reboots only when
# a fallback is armed (see awnix-greenboot-fallback.sh).
[Unit]
OnFailure=awnix-greenboot-fallback.service
