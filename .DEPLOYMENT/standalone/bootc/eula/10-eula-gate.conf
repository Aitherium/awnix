# Licence gate for a product unit on a proprietary awnix image (garg-appliance, aitheros,
# aitheros-cloud). Installed as <unit>.d/10-eula-gate.conf on every unit that eula.json
# lists under gated_units.
#
# ExecCondition exit 0 lets the unit start. Exit 1 makes systemd SKIP it: the unit is
# not failed, nothing waits on it, and boot always completes. Once the licence terms are
# accepted (tty, web console, seed or answers file), aither-eula.path starts
# aither-eula-release.service, which starts the gated units without a reboot.
#
# Public awnix images never ship this file (check_eula_firstboot EUL005).
[Service]
ExecCondition=/usr/bin/aither-eula gate
