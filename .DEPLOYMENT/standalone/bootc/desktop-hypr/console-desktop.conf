# /usr/lib/awnix/console.d/desktop.conf -- the awnix desktop's console is LOOPBACK ONLY.
#
# On this image the console is the desktop's Settings app, opened by awnix-settings in
# the local browser. Nothing on the network may reach a root broker that the person at
# the keyboard already has. An admin who wants the LAN console sets
# AWNIX_CONSOLE_BIND in /etc/awnix/console.conf, which wins over this drop-in.
AWNIX_CONSOLE_BIND=127.0.0.1
AWNIX_CONSOLE_PROFILE=awnix
AWNIX_CONSOLE_BRAND=awnix
