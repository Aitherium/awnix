# Drop-in for awsh-agent.service and awsh-harness.service on the awnix desktop
# (/usr/lib/systemd/user/<unit>.d/10-awnix-desktop.conf).
#
# The units themselves are the ones every awnix image ships (awsh/*.service): loopback
# bind on the command line, AITHER_OFFLINE=1. This image only adds what a desktop
# session needs: start after the local model's unit, so the first question does not race
# the server it is answered from (awnix-model.service is skipped until a model is
# chosen, and an ordering on a skipped unit is satisfied), and never ask PyPI whether a
# newer awdk exists -- the image is the unit of update here (`awnix update`).
[Unit]
After=awnix-model.service

[Service]
Environment=ADK_NO_UPDATE_CHECK=1
