# /usr/lib/systemd/user/awsh-harness.service.d/20-awnix-per-user.conf -- the harness
# daemon on this user's own port (60-awnix-ports); skipped when there is none. It already
# demands its bearer (~/.aither/harness_token) on every route but /health and narrows
# CORS to loopback when offline, so only the port changes. @AWDK_PYTHON@ is replaced at
# build with the interpreter the installed `adk` runs under.
[Unit]
ConditionEnvironment=AWNIX_HARNESS_PORT

[Service]
ExecStart=
ExecStart=@AWDK_PYTHON@ -m adk.cli harness serve --host 127.0.0.1 --port ${AWNIX_HARNESS_PORT}
