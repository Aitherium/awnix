# /usr/lib/systemd/user/awsh-agent.service.d/20-awnix-per-user.conf -- the agent daemon
# on the awnix desktop: this user's own port, and the awdk defaults that are unsafe on a
# machine people share, turned off. Every variable below is read by the awdk the image
# installs (desktop-open/awdk-requirements.txt pins it; the build greps the INSTALLED
# adk/server.py for each name, check_awnix_desktop.py AWDK012).
#
#   AITHER_MCP_GATEWAY=         empty: never dial a "local MCP gateway". awdk's default
#                               is 127.0.0.1:8182, which nothing here serves, so any
#                               local user could bind it and be handed the account key
#                               or ~/.aither/session-bearer.
#   AITHER_CORS_ORIGINS=        loopback origins only. awdk's default admits hosted
#                               aitherium.com pages (and a third party's github.io),
#                               which could then drive this offline agent from a tab.
#   AITHER_BROWSER_HANDOFF=0    no route that mints a browser ticket for the account
#                               to whoever sends an allowed Origin header.
#   AITHER_LOCAL_AUTH=required  the per-user credential (~/.aither/daemon-token) on
#                               every request and websocket, loopback included: no
#                               other local user can drive this daemon. awdk >= 3.8.48
#                               (adk/local_auth.py); the build proves the pinned one
#                               reads and honours it.
#
# @AWDK_PYTHON@ is replaced at build with the interpreter the installed `adk` runs
# under; the port comes from 60-awnix-ports, and without one the unit is skipped.
[Unit]
ConditionEnvironment=AWNIX_AGENT_PORT

[Service]
Environment=AITHER_MCP_GATEWAY=
Environment=AITHER_CORS_ORIGINS=http://127.0.0.1,http://localhost
Environment=AITHER_BROWSER_HANDOFF=0
Environment=AITHER_LOCAL_AUTH=required
ExecStart=
ExecStart=@AWDK_PYTHON@ -m adk.server --host 127.0.0.1 --port ${AWNIX_AGENT_PORT} --backend vllm --identity aither
