# awnix desktop -- Hyprland, vendor config (/usr/share/awnix/desktop/hyprland.conf).
#
# awnix-session starts Hyprland with --config pointing HERE, so this file is read-only
# and updates with the image. Yours is ~/.config/hypr/awnix-user.conf, sourced last, so
# anything you set there wins. Colours and gaps come from the theme (awnix-theme set).
#
# No key is bound in this file. bindings.conf is generated at image build from
# bindings.toml by awnix-keys, the same file the Super+/ menu reads -- so the menu and
# the keys cannot disagree. check_awnix_desktop.py fails the build lane if a `bind`
# line ever appears here.

monitor = , preferred, auto, 1

env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb
env = MOZ_ENABLE_WAYLAND,1
env = GDK_BACKEND,wayland,x11,*
env = ELECTRON_OZONE_PLATFORM_HINT,auto

source = ~/.config/awnix/theme/hyprland.conf
source = /usr/share/awnix/desktop/bindings.conf

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

gestures {
    workspace_swipe = true
}

dwindle {
    pseudotile = true
    preserve_split = true
}

animations {
    enabled = true
    bezier = ease, 0.2, 0.9, 0.1, 1.0
    animation = windows, 1, 4, ease, popin 85%
    animation = fade, 1, 4, ease
    animation = workspaces, 1, 4, ease, slide
}

# The agent floats over whatever you are doing, centred -- Super+A.
windowrulev2 = float, class:^(awnix-awsh)$
windowrulev2 = size 62% 66%, class:^(awnix-awsh)$
windowrulev2 = center, class:^(awnix-awsh)$
# Short-lived system dialogs (update, component, model pick).
windowrulev2 = float, class:^(awnix-float)$
windowrulev2 = size 56% 60%, class:^(awnix-float)$
windowrulev2 = center, class:^(awnix-float)$
windowrulev2 = float, class:^(org.pulseaudio.pavucontrol|pavucontrol|blueman-manager|nm-connection-editor|swappy)$

exec-once = awnix-desktop-autostart

source = ~/.config/hypr/awnix-user.conf
