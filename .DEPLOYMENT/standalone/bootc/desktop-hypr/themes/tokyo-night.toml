# awnix theme: Tokyo Night. enkia's Tokyo Night (night variant).
# One file per theme; `awnix-theme set tokyo-night` renders every surface from it.
# Every key below is used by a template -- check_awnix_desktop.py fails if one is missing.
name = "Tokyo Night"

[colors]
bg = "#1a1b26"
bg_alt = "#16161e"
surface = "#24283b"
overlay = "#414868"
fg = "#c0caf5"
fg_dim = "#a9b1d6"
muted = "#565f89"
accent = "#7aa2f7"
accent_alt = "#bb9af7"
good = "#9ece6a"
warn = "#e0af68"
urgent = "#f7768e"

[ansi]
black = "#15161e"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#a9b1d6"
bright_black = "#414868"
bright_red = "#f7768e"
bright_green = "#9ece6a"
bright_yellow = "#e0af68"
bright_blue = "#7aa2f7"
bright_magenta = "#bb9af7"
bright_cyan = "#7dcfff"
bright_white = "#c0caf5"

[font]
mono = "JetBrains Mono"
ui = "Noto Sans"
size = 11

[shape]
rounding = 8
gaps_in = 5
gaps_out = 10
border = 2
inactive_opacity = 0.94

[gtk]
theme = "Adwaita-dark"
icons = "Papirus-Dark"
prefer_dark = true

[wallpaper]
top = "#16161e"
bottom = "#24283b"
glow = "#bb9af7"
