# awnix theme: Gruvbox Dark. morhetz's gruvbox, dark medium contrast.
# One file per theme; `awnix-theme set gruvbox` renders every surface from it.
# Every key below is used by a template -- check_awnix_desktop.py fails if one is missing.
name = "Gruvbox Dark"

[colors]
bg = "#282828"
bg_alt = "#1d2021"
surface = "#3c3836"
overlay = "#504945"
fg = "#ebdbb2"
fg_dim = "#d5c4a1"
muted = "#928374"
accent = "#fabd2f"
accent_alt = "#83a598"
good = "#b8bb26"
warn = "#fe8019"
urgent = "#fb4934"

[ansi]
black = "#282828"
red = "#cc241d"
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
magenta = "#b16286"
cyan = "#689d6a"
white = "#a89984"
bright_black = "#928374"
bright_red = "#fb4934"
bright_green = "#b8bb26"
bright_yellow = "#fabd2f"
bright_blue = "#83a598"
bright_magenta = "#d3869b"
bright_cyan = "#8ec07c"
bright_white = "#ebdbb2"

[font]
mono = "JetBrains Mono"
ui = "Noto Sans"
size = 11

[shape]
rounding = 8
gaps_in = 5
gaps_out = 10
border = 2
inactive_opacity = 0.94

[gtk]
theme = "Adwaita-dark"
icons = "Papirus-Dark"
prefer_dark = true

[wallpaper]
top = "#1d2021"
bottom = "#32302f"
glow = "#fe8019"
