# GENERATED by awnix-theme from the {{name}} theme -- `awnix-theme set` overwrites it.
[main]
font={{font.mono}}:size={{font.size}}
terminal=foot -e
prompt="> "
layer=overlay
width=52
lines=14
horizontal-pad=20
vertical-pad=12
inner-pad=8
icon-theme={{gtk.icons}}

[colors]
background={{colors.bg|hex}}f2
text={{colors.fg|hex}}ff
prompt={{colors.accent|hex}}ff
input={{colors.fg|hex}}ff
match={{colors.accent|hex}}ff
selection={{colors.surface|hex}}ff
selection-text={{colors.fg|hex}}ff
selection-match={{colors.accent|hex}}ff
border={{colors.accent|hex}}ff

[border]
width={{shape.border}}
radius={{shape.rounding}}
