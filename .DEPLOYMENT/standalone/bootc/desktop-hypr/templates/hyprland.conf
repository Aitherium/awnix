# GENERATED by awnix-theme from the {{name}} theme -- `awnix-theme set` overwrites it.
# Put your own settings in ~/.config/hypr/awnix-user.conf, which is sourced after this.
general {
    gaps_in = {{shape.gaps_in}}
    gaps_out = {{shape.gaps_out}}
    border_size = {{shape.border}}
    col.active_border = {{colors.accent|hypr}} {{colors.accent_alt|hypr}} 45deg
    col.inactive_border = {{colors.surface|hypr}}
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = {{shape.rounding}}
    active_opacity = 1.0
    inactive_opacity = {{shape.inactive_opacity}}
    blur {
        enabled = true
        size = 6
        passes = 2
    }
}

misc {
    background_color = {{colors.bg|hypr}}
    disable_hyprland_logo = true
    disable_splash_rendering = true
}
