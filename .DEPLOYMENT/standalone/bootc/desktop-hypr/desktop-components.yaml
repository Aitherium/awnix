# What the awnix desktop IS -- baked, read-only rows for `awnix component list`.
#
# Installed at /usr/share/awnix/components.d/desktop.yaml by Containerfile.awnix-hypr.
# The components.d shape awnix-component reads (see garg-components.yaml): state=baked,
# not removable, and no add-on may shadow a command in `provides` without --force.
# Versions are the Fedora 42 builds the image installs (koji f42-updates, 2026-09-28).
#
# Why here and not awnix-catalogue.yaml: that file is GENERATED by
# gen_installer_catalogue.py from ecosystem.yaml (aw* bricks, pip-installed), and the
# component lock pins its sha256 (AWC001). An OS package baked into the image is what
# components.d exists for.
#
# Flat shape on purpose: awnix-component parses it without PyYAML.
schema: 1
components:
  - id: hyprland
    kind: baked
    version: "0.45.2"
    source: "fedora-42 hyprland-0.45.2-1.fc42"
    provides: [Hyprland, hyprctl]
    removable: false
  - id: neovim
    kind: baked
    version: "0.11.5"
    source: "fedora-42 neovim + /etc/xdg/nvim/sysinit.vim"
    provides: [nvim]
    removable: false
  - id: git
    kind: baked
    version: "fedora-42"
    source: "fedora-42 git"
    provides: [git]
    removable: false
  - id: distrobox
    kind: baked
    version: "1.8.2.4"
    source: "fedora-42 distrobox (podman backend)"
    provides: [distrobox]
    removable: false
  - id: firefox
    kind: baked
    version: "fedora-42"
    source: "fedora-42 firefox"
    provides: [firefox]
    removable: false
  - id: foot
    kind: baked
    version: "fedora-42"
    source: "fedora-42 foot"
    provides: [foot]
    removable: false
